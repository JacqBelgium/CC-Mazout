name: Prijzen ophalen

on:
  schedule:
    # 21:00 UTC = 22:00/23:00 Belgische tijd, ruim na CME-settlement (±20:30 BE-tijd).
    # GitHub start geplande runs vaak 1-3 uur later; het script dateert de data zelf
    # (FOD-geldigheidsdatum, yfinance-slotkoersdag), dus een run na middernacht is geen probleem.
    - cron: '0 21 * * *'
    # Alleen-FOD-runs: FOD publiceert het tarief van morgen in de loop van de ochtend.
    # Meerdere pogingen zodat het nieuwe tarief snel op de site staat, ook als GitHub
    # een run vertraagt. De stap kiest op github.event.schedule — deze strings moeten
    # exact overeenkomen met de if-voorwaarden hieronder.
    - cron: '0 5 * * *'
    - cron: '30 6 * * *'
    - cron: '0 8 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: "Welke job draaien?"
        type: choice
        default: daily
        options:
          - daily
          - fod_only
          - backfill_statbel
          - backfill_yfinance
          - apply_schema

permissions:
  contents: read
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: pip install -r scripts/requirements.txt

      - name: Schema toepassen (eenmalig, via unpooled verbinding)
        if: github.event.inputs.job == 'apply_schema'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          DB_URL=$(printf '%s' "${{ secrets.DATABASE_URL_UNPOOLED }}" | tr -d '\n\r')
          psql "$DB_URL" -f sql/schema.sql

      # Let op: bij een schedule-event is github.event.inputs null, en `null == ''` is in
      # GitHub-expressies waar. Daarom de lege-input-check expliciet beperken tot handmatige runs.
      - name: Dagelijkse prijzen ophalen (FOD + markt)
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 21 * * *') ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'daily' || github.event.inputs.job == ''))
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/fetch_prices.py

      - name: Tarief van morgen ophalen (alleen FOD)
        if: >-
          (github.event_name == 'schedule' && github.event.schedule != '0 21 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'fod_only')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/fetch_prices.py --fod-only

      # Statbel levert de FOD-maximumprijs per geldigheidsdag (ook voor morgen) en vult zo
      # de dagen aan waarvoor de FOD-pagina geen nieuwe datum toont (weekend, feestdagen).
      # Draait na elke geplande run (21:00 en de ochtend-runs). Een storing bij Statbel mag
      # de run niet laten falen — de FOD-data van de stap hierboven is dan al weggeschreven.
      # !cancelled(): ook aanvullen als de FOD-stap zelf faalde.
      - name: FOD-prijzen aanvullen via Statbel
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backfill_statbel.py

      - name: Eenmalige historische backfill (Statbel)
        if: github.event.inputs.job == 'backfill_statbel'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backfill_statbel.py

      - name: Eenmalige historische backfill (yfinance markt/WTI)
        if: github.event.inputs.job == 'backfill_yfinance'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backfill_yfinance.py

      - name: Houd workflow actief (reset 60-dagen-inactiviteitsregel)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fetch-prices.yml/enable"
