name: Prijzen ophalen

on:
  schedule:
    # 19:00 UTC = ±21:00 Belgische tijd, na CME-settlement (±20:30 BE-tijd).
    # Let op: vaste UTC-tijd, dus rond de wissel zomer/wintertijd schuift het
    # Belgische lokale moment ~1 uur op — voor dit doel verwaarloosbaar.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Welke job draaien?"
        type: choice
        default: daily
        options:
          - daily
          - backfill_statbel
          - backfill_yfinance
          - apply_schema

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: pip install -r scripts/requirements.txt

      - name: Schema toepassen (eenmalig, via unpooled verbinding)
        if: github.event.inputs.job == 'apply_schema'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          DB_URL=$(printf '%s' "${{ secrets.DATABASE_URL_UNPOOLED }}" | tr -d '\n\r')
          psql "$DB_URL" -f sql/schema.sql

      - name: Dagelijkse prijzen ophalen
        if: github.event_name == 'schedule' || github.event.inputs.job == 'daily' || github.event.inputs.job == ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/fetch_prices.py

      - name: Eenmalige historische backfill (Statbel)
        if: github.event.inputs.job == 'backfill_statbel'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backfill_statbel.py

      - name: Eenmalige historische backfill (yfinance markt/WTI)
        if: github.event.inputs.job == 'backfill_yfinance'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backfill_yfinance.py

